# mke2fs settings for baking the XD+ vendor partition.
#
# ⚠️ THIS FILE IS NOT OPTIONAL. mke2fs reads $MKE2FS_CONFIG, falling back to the
# HOST's /etc/mke2fs.conf -- and on e2fsprogs 1.47+ that enables features (notably
# orphan_file) the prebuilt 1.45.4 tooling and this 2020-era device cannot read.
# build_vendor_image.sh always exports MKE2FS_CONFIG to point here.
#
# The feature set below is not AOSP's default: it reproduces the OEM ALLDOCUBE
# image exactly, as read back with `dumpe2fs -h`:
#   has_journal ext_attr resize_inode filetype extent sparse_super large_file uninit_bg
# Relative to AOSP's mke2fs.conf that means resize_inode added, and dir_index,
# huge_file, dir_nlink and extra_isize removed. Dropping dir_index also makes the
# bake deterministic: with it, mke2fs stamps a random Directory Hash Seed and two
# bakes of identical input differ byte-for-byte.

[defaults]
    base_features = sparse_super,large_file,filetype,ext_attr,resize_inode
    default_mntopts = ""
    enable_periodic_fsck = 0
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    reserved_ratio = 0.0

[fs_types]
    ext4 = {
        features = has_journal,extent,uninit_bg
        inode_size = 256
    }
